<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="icon" href="pencil.png">

    <style>
        
h1{
    color: rgb(105, 20, 20);
    text-align: center;
    font-family: Arial, Helvetica, sans-serif;
}
h2,h3{
    font-family: Arial, Helvetica, sans-serif;
    color: rgb(179, 94, 94);
    text-align: center;
}
div{
    color:rgba(159, 56, 56, 0.582);
}

        .parallax {
            height: 600px;
            background-image: url('f1.jpg');
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .centralizada {
            width: 100px;
            margin: auto;
            background-color: rgba(125, 35, 35, 0.854);
            text-align: center;
            padding: 20px;
            border: 2px solid rgba(170, 74, 74, 0.737);
            border-radius: 10px;
        }

        .overlay h1 {
            background-color: #632b2b69;
            padding: 10px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-family: "Georgia", serif;
            font-size: 2rem;
            color: #ae4747;
            margin: 0;
        }

        .profile-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding: 20px;
        }

        .profile-image {
            margin-right: 30px;
        }

        .profile-image img {
            border-radius: 50%;
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 3px solid #842f2f;
        }

        .profile-info {
            max-width: 500px;
        }

        .profile-info h2 {
            color: #923636;
            font-size: 1.5rem;
            margin: 0;
        }

        .profile-info h2 span {
            font-size: 1.2rem;
            color: #000;
        }

        .profile-info p {
            font-size: 1rem;
            margin: 10px 0;
        }

        .profile-info h3 {
            font-size: 1.3rem;
            margin-top: 20px;
            color: #982929;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .gallery img {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
        }

        .descricao {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
        }

        .direita {
            background-color: #fff;
            color: #000;
            width: 100%;
            text-align: center;
        }

        .gallery img:hover {
            transform: scale(1.1);
        }

        .profile-image:hover {
            transform: scale(1.1);
        }

        details {
            color: #842f2f
        }
        summary {
  font-size: 22px;  /* aumenta só o título */
  font-weight: bold; /* deixa em negrito se quiser */
  cursor: pointer;   /* adiciona o ponteiro de clique */
}

        .item img {
            width: 100%;
            border-radius: 20px;
        }
        .item img:hover{
            transform: scale(1.1);
        }
        .galeria{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 5fr));
            gap: 10px;
        }
        .card{
            border: 1px solid #cccc;
            border-radius: 10px;
            width: 220px;
            padding: 10px;
            margin: 10px;
            text-align: center;
            position: relative;
        }
        .card img{
            border-radius: 10px;
            width: 100%;
        }
        .tag-oferta{
            position: absolute;
            background-color: red;
            color: aliceblue;
            padding: 4px 8px;
            border-radius: 5px;
        }
        .jorge {
  display: flex;            
  justify-content: center;   
  gap: 20px;           
  flex-wrap: wrap; 
                   }         
  .card{
            border: 1px solid #cccc;
            border-radius: 10px;
            width: 220px;
            padding: 10px;
            margin: 10px;
            text-align: center;
            position: relative;
        }
        .card img{
            border-radius: 10px;
            width: 100%;
        }
        .tag-oferta{
            position: absolute;
            background-color: red;
            color: aliceblue;
            padding: 4px 8px;
            border-radius: 5px;
        }
        .card img:hover{
            transform: scale(1.1);
        }
        footer {
      padding: 10px;
      background-color: #403d3d3e;
      width: 100%;
      text-align: center;
      font-size: 0.9em;
    }
    </style>
</head>
